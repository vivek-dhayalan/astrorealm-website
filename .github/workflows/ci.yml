# AstroRealm CI/CD
#  - every push and pull request: run the test suite (Python 3.11, Swiss Ephemeris)
#  - push to main (after tests pass): build the image, deploy it to Cloud Run (Mumbai),
#    then publish the Firebase Hosting config that serves https://astrorealm.in
#
# GitHub settings needed (Settings → Secrets and variables → Actions):
#   Variables: GCP_PROJECT_ID
#   Secrets:   GCP_WIF_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#              GCP_DEPLOY_SA      github-deploy@<project-id>.iam.gserviceaccount.com
# No Google keys are stored in GitHub: it signs in with Workload Identity Federation (see README).
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: asia-south1
  SERVICE: astrorealm
  REPOSITORY: astrorealm

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-swisseph.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-swisseph.txt
      - name: Run tests
        # The private golden fixtures are not in the repo, so those tests are skipped here.
        run: python -m pytest -q

  deploy:
    name: Deploy to Google Cloud
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # lets GitHub sign in to Google without a stored key
    environment:
      name: production
      url: https://astrorealm.in
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # GeoNames dumps change slowly; reuse this month's download instead of fetching ~400 MB every deploy.
      - name: Month stamp for the place-data cache
        id: month
        run: echo "stamp=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore place data
        id: geo
        uses: actions/cache@v4
        with:
          path: data/geonames.sqlite
          key: geonames-${{ steps.month.outputs.stamp }}-${{ hashFiles('scripts/build_geonames.py') }}
      - name: Build place data (GeoNames)
        if: steps.geo.outputs.cache-hit != 'true'
        run: python scripts/build_geonames.py

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" \
            --allow-unauthenticated \
            --cpu 1 --memory 1Gi --concurrency 40 \
            --min-instances 0 --max-instances 2 --cpu-boost \
            --env-vars-file deploy/cloudrun.env.yaml \
            --set-secrets TURNSTILE_SECRET_KEY=turnstile-secret:latest \
            --quiet

      - name: Publish Firebase Hosting (astrorealm.in → Cloud Run)
        run: npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID" --non-interactive
